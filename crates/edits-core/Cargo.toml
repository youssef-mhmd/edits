[package]
name = "edits-core"
description = "Document model, PDFium wrapper, render queue and caches for edits"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pdfium-render.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
unicode-normalization = "0.1.26"
unicode-bidi = "0.3.18"

# Serves as a render worker for the engine tests; the app and edits-bench
# use their own executables.
[[bin]]
name = "edits-render-worker"
path = "src/bin/render_worker.rs"
test = false

[lints]
workspace = true

[dev-dependencies]
lopdf = { workspace = true }
