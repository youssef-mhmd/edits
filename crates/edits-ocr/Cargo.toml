[package]
name = "edits-ocr"
description = "OCR for edits: a Rust port of the arabic-ocr pipeline, models run with ONNX Runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# load-dynamic: onnxruntime.dll is loaded at run time, on the first OCR.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic"] }
flate2 = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
png = "0.18"

[lints]
workspace = true
