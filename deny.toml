# cargo-deny: dependency licenses must be compatible with Apache-2.0 (PRD 10.1).
# GPL/AGPL are not allowed. Run: cargo deny check licenses bans sources

[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = false

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "BSL-1.0",
  "0BSD",
  "CDLA-Permissive-2.0",
  "bzip2-1.0.6",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
