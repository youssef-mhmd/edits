[package]
name = "edits"
description = "A fast PDF reader and editor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "edits_app"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
edits-core.workspace = true
edits-edit.workspace = true
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
# Same versions as Tauri's own, for the WebView2 shared-buffer tile transport.
webview2-com = "0.38"
windows-core = "0.61"
