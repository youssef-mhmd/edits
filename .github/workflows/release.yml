name: Release

# Pushing a tag such as v0.1.0 builds the signed installer and the updater
# manifest (latest.json) and puts them on a draft GitHub release. Publish
# the draft by hand; installed copies see the update only once it is
# published (the updater reads releases/latest).
#
# Repository secrets: TAURI_SIGNING_PRIVATE_KEY (the contents of the
# updater private key) and, if the key has one, TAURI_SIGNING_PRIVATE_KEY_PASSWORD.

on:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fetch PDFium
        shell: pwsh
        run: ./scripts/fetch-pdfium.ps1
      - run: npm ci
      - name: Tests
        run: cargo test --workspace
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: edits ${{ github.ref_name }}
          releaseBody: See docs/release-notes.md for what changed.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
