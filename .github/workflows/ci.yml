name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fetch PDFium
        shell: pwsh
        run: ./scripts/fetch-pdfium.ps1
      - run: npm ci
      - name: Front end lint and type check
        run: |
          npm run lint
          npm run check
      - run: npm run build
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace
      - name: Corpus crash check (synthetic corpus)
        run: |
          cargo build -p edits-bench --release
          ./target/release/edits-bench gen-corpus corpus/files
          ./target/release/edits-bench check corpus/files
      - name: Engine benchmark (synthetic corpus)
        # CI runners are not the reference machine (PRD 7); this catches large
        # regressions only. App-level numbers are measured locally.
        run: ./target/release/edits-bench core corpus/files/synthetic/images-10mb.pdf corpus/files/synthetic/latin-text-2000p.pdf --json bench-core.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-core
          path: bench-core.json
          if-no-files-found: ignore

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
