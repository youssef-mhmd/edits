[workspace]
resolver = "3"
members = ["crates/edits-core", "crates/edits-bench", "src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
edits-core = { path = "crates/edits-core" }
pdfium-render = { version = "0.9.6", default-features = false, features = ["pdfium_8125", "thread_safe"] }
lopdf = { version = "0.47", default-features = false }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
